<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chapter select</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Passion+One:wght@400;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#1c1424;font-family:Archivo,sans-serif;color:#f6efe2}
</style>
</head>
<body>
<div style="width: 1920px; height: 1080px; box-sizing: border-box; padding: 56px 100px 44px 100px; background: #1c1424; display: flex; flex-direction: column; gap: 32px; font-family: Archivo, sans-serif; color: #f6efe2">
<h1 style="margin: 0; font-family: 'Passion One', sans-serif; font-weight: 400; font-size: 68px; line-height: 1; color: #edc65a">CHAPTERS</h1>

<div style="display: flex; gap: 40px; flex-grow: 1">

<div style="width: 560px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px">
<button type="button" style="box-sizing: border-box; padding: 18px 22px; border-radius: 16px; border: 3px solid #edc65a; background: #c9ab6a; color: #231a2b; box-shadow: 0 5px 0 #7d6636; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; cursor: pointer">
<span style="font-family: 'Passion One', sans-serif; font-size: 36px; line-height: 1">Fixture Chapter</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.1em">2 STAGES</span>
</button>
<button type="button" disabled style="box-sizing: border-box; padding: 18px 22px; border-radius: 16px; border: 2px solid #3d3049; background: #241b2d; color: rgba(246,239,226,0.4); display: flex; align-items: center; gap: 14px; text-align: left">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<span style="font-family: 'Passion One', sans-serif; font-size: 36px; line-height: 1">[Chapter 2]</span>
</button>
</div>

<div style="flex-grow: 1; box-sizing: border-box; padding: 36px 44px; background: #2e2239; border: 2px solid #c9ab6a; border-radius: 20px; box-shadow: 0 6px 0 #120d18; display: flex; flex-direction: column; gap: 28px">
<span style="font-family: 'Passion One', sans-serif; font-size: 64px; line-height: 1">Fixture Chapter</span>
<span style="font-size: 22px; color: #63c96e; font-weight: 600">Continue from stage 2</span>
<div style="display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.14em; color: #c9ab6a">DIFFICULTY</span>
<div style="display: flex; gap: 14px">
<button type="button" aria-pressed="true" style="padding: 12px 30px; border-radius: 14px; border: 3px solid #edc65a; background: #c9ab6a; color: #231a2b; font-family: 'Passion One', sans-serif; font-size: 30px; cursor: pointer">Normal</button>
<button type="button" aria-pressed="false" style="padding: 12px 30px; border-radius: 14px; border: 2px solid #7d6636; background: #1e1628; color: #f6efe2; font-family: 'Passion One', sans-serif; font-size: 30px; cursor: pointer">Hard</button>
<button type="button" disabled style="padding: 12px 30px; border-radius: 14px; border: 2px solid #3d3049; background: #241b2d; color: rgba(246,239,226,0.4); font-family: 'Passion One', sans-serif; font-size: 30px; display: flex; align-items: center; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Nightmare</button>
</div>
<span style="font-size: 18px; color: rgba(246,239,226,0.62)">Beat this chapter on Hard to open Nightmare.</span>
</div>
<button type="button" style="margin-top: auto; align-self: flex-start; padding: 16px 48px; border-radius: 16px; border: 3px solid #edc65a; background: #c9ab6a; color: #231a2b; font-family: 'Passion One', sans-serif; font-size: 40px; box-shadow: 0 5px 0 #7d6636; cursor: pointer">Launch</button>
</div>

</div>

<div style="display: flex; justify-content: flex-end; align-items: center; gap: 28px; font-weight: 600; font-size: 18px">
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; min-width: 40px; height: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 8px; align-items: center; justify-content: center; background: #4a3d58; color: #f6efe2; font-size: 12px">▲ ▼</span><span>Chapter</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; min-width: 40px; height: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 8px; align-items: center; justify-content: center; background: #4a3d58; color: #f6efe2; font-size: 12px">◀ ▶</span><span>Difficulty</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; width: 26px; height: 26px; border-radius: 13px; align-items: center; justify-content: center; background: #4f9a3a; color: #ffffff; font-weight: 700; font-size: 14px">A</span><span>Launch</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; width: 26px; height: 26px; border-radius: 13px; align-items: center; justify-content: center; background: #d0453c; color: #ffffff; font-weight: 700; font-size: 14px">B</span><span>Back</span></div>
</div>
</div>
</body>
</html>
