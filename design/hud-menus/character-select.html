<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Character select</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Passion+One:wght@400;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#1c1424;font-family:Archivo,sans-serif;color:#f6efe2}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; box-sizing: border-box; padding: 56px 100px 44px 100px; background: #1c1424; display: flex; flex-direction: column; gap: 32px; font-family: Archivo, sans-serif; color: #f6efe2">
<h1 style="margin: 0; text-align: center; font-family: 'Passion One', sans-serif; font-weight: 400; font-size: 68px; line-height: 1; color: #edc65a">CHOOSE YOUR HERO</h1>

<div style="display: flex; gap: 40px; flex-grow: 1">

<div style="flex-grow: 1; flex-basis: 0; box-sizing: border-box; padding: 28px 32px; background: #2e2239; border: 2px solid #c9ab6a; border-radius: 20px; box-shadow: 0 6px 0 #120d18; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="padding: 2px 10px; border-radius: 8px; background: #c9ab6a; color: #231a2b; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px">P1</span>
<svg width="30" height="22" viewBox="0 0 28 20" fill="none" stroke="#f6efe2" stroke-width="2" aria-hidden="true"><path d="M6 3h16a5 5 0 0 1 5 6l-1 6a3 3 0 0 1-5 1l-2-3h-10l-2 3a3 3 0 0 1-5-1l-1-6a5 5 0 0 1 5-6z"/><path d="M8 8v4M6 10h4"/></svg>
<span style="font-family: 'Space Mono', monospace; font-size: 13px; letter-spacing: 0.1em; color: rgba(246,239,226,0.62)">CONTROLLER</span>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 36px">
<button type="button" aria-label="Previous hero" style="width: 56px; height: 56px; border-radius: 28px; border: 2px solid #7d6636; background: #1e1628; color: #f6efe2; font-size: 22px; cursor: pointer">◀</button>
<div style="width: 280px; height: 280px; box-sizing: border-box; border-radius: 140px; background: #1e1628; border: 4px solid #c9ab6a; display: flex; align-items: center; justify-content: center">
<svg width="150" height="150" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4c3 8 12 12 12 24a12 12 0 0 1-24 0c0-6 3-9 6-12 0 5 2 8 5 9-2-7 1-14 1-21z" fill="#FF4A1C" stroke="#1A1917" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 26c2 3 5 5 5 9a5 5 0 0 1-10 0c0-4 3-6 5-9z" fill="#FFF1B0"/></svg>
</div>
<button type="button" aria-label="Next hero" style="width: 56px; height: 56px; border-radius: 28px; border: 2px solid #7d6636; background: #1e1628; color: #f6efe2; font-size: 22px; cursor: pointer">▶</button>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 14px">
<span style="font-family: 'Passion One', sans-serif; font-size: 52px; line-height: 1">[Fire hero]</span>
<span style="padding: 4px 12px; border-radius: 10px; background: #FF4A1C; color: #231a2b; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px; letter-spacing: 0.12em">FIRE</span>
</div>
<div style="display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 18px; row-gap: 10px; font-size: 19px; padding: 0 24px">
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; color: #c9ab6a; padding-top: 4px">SIGNATURE</span><span>Flames erupt in a line ahead</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; color: #c9ab6a; padding-top: 4px">AURA</span><span>A ring of fire bursts around you</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; color: #c9ab6a; padding-top: 4px">LEAP</span><span>A burst of flame lifts you higher</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 0.12em; color: #c9ab6a; padding-top: 4px">STATUS</span><span>Burn: damage over time</span>
</div>
<div style="margin-top: auto; display: flex; justify-content: center; gap: 12px">
<div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 14px; background: #1e1628; border: 3px solid #edc65a; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 4c3 8 12 12 12 24a12 12 0 0 1-24 0c0-6 3-9 6-12 0 5 2 8 5 9-2-7 1-14 1-21z" fill="#FF4A1C" stroke="#1A1917" stroke-width="3" stroke-linejoin="round"/></svg></div>
<div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 14px; background: #1e1628; border: 2px solid #7d6636; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 L36 18 L24 45 L12 18 Z" fill="#59BFFF" stroke="#1A1917" stroke-width="3" stroke-linejoin="round"/></svg></div>
<div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 14px; background: #1e1628; border: 2px solid #7d6636; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 38 L14 16 L26 8 L40 18 L42 38 Z" fill="#8C6B40" stroke="#1A1917" stroke-width="3" stroke-linejoin="round"/><path d="M26 8 L24 24 L42 30" stroke="#E3C99A" stroke-width="2.5" fill="none"/></svg></div>
<div style="width: 64px; height: 64px; box-sizing: border-box; border-radius: 14px; background: #1e1628; border: 2px solid #7d6636; display: flex; align-items: center; justify-content: center"><svg width="38" height="38" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 20 C 14 8, 36 8, 38 20 C 40 30, 26 32, 24 24" fill="none" stroke="#D9F2FF" stroke-width="5" stroke-linecap="round"/><path d="M8 32 C 18 40, 34 38, 40 30" fill="none" stroke="#5FA3A0" stroke-width="5" stroke-linecap="round"/></svg></div>
</div>
</div>

<div style="flex-grow: 1; flex-basis: 0; box-sizing: border-box; padding: 28px 32px; background: #1e1628; border: 3px dashed #7d6636; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px">
<span style="padding: 2px 10px; border-radius: 8px; background: #7d6636; color: #231a2b; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px">P2</span>
<span style="font-family: 'Passion One', sans-serif; font-size: 52px; line-height: 1; color: rgba(246,239,226,0.62)">Press to join</span>
<div style="display: flex; align-items: center; gap: 14px; font-size: 20px; color: rgba(246,239,226,0.62)">
<span style="display: inline-flex; width: 30px; height: 30px; border-radius: 15px; align-items: center; justify-content: center; background: #4f9a3a; color: #ffffff; font-weight: 700; font-size: 16px">A</span>
<span>or</span>
<span style="display: inline-flex; min-width: 30px; height: 30px; padding: 0 8px; box-sizing: border-box; border-radius: 7px; align-items: center; justify-content: center; background: #f6efe2; color: #231a2b; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; box-shadow: 0 2px 0 #7d6636">Enter</span>
</div>
</div>

</div>

<div style="display: flex; justify-content: flex-end; align-items: center; gap: 28px; font-weight: 600; font-size: 18px">
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; min-width: 40px; height: 26px; padding: 0 6px; box-sizing: border-box; border-radius: 8px; align-items: center; justify-content: center; background: #4a3d58; color: #f6efe2; font-size: 12px">◀ ▶</span><span>Pick</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; width: 26px; height: 26px; border-radius: 13px; align-items: center; justify-content: center; background: #4f9a3a; color: #ffffff; font-weight: 700; font-size: 14px">A</span><span>Ready</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; width: 26px; height: 26px; border-radius: 13px; align-items: center; justify-content: center; background: #d0453c; color: #ffffff; font-weight: 700; font-size: 14px">B</span><span>Back</span></div>
</div>
</div>
</body>
</html>
