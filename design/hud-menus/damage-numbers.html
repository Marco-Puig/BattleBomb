<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Damage numbers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Passion+One:wght@400;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#1c1424;font-family:Archivo,sans-serif;color:#f6efe2}
</style>
</head>
<body>
<div style="width: 1280px; height: 720px; display: flex; flex-direction: column; font-family: Archivo, sans-serif">

<div style="height: 360px; background: #bcd6ea; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<span style="font-family: 'Passion One', sans-serif; font-size: 50px; line-height: 1; color: #ffed59; text-shadow: -3px 0 #1a1917, 3px 0 #1a1917, 0 -3px #1a1917, 0 4px #1a1917">34</span>
<span style="padding: 3px 10px; border-radius: 8px; background: #2e2239; color: #f6efe2; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.12em">NORMAL HIT</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<span style="font-family: 'Passion One', sans-serif; font-size: 72px; line-height: 1; color: #ffffff; text-shadow: -3px 0 #1a1917, 3px 0 #1a1917, 0 -3px #1a1917, 0 5px #1a1917, 0 0 24px #fff1b0">71</span>
<span style="padding: 3px 10px; border-radius: 8px; background: #2e2239; color: #f6efe2; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.12em">CRIT · WHITE-HOT, ×1.4</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<span style="font-family: 'Passion One', sans-serif; font-size: 36px; line-height: 1; color: #ff9e4d; text-shadow: -2px 0 #1a1917, 2px 0 #1a1917, 0 -2px #1a1917, 0 3px #1a1917">6</span>
<span style="padding: 3px 10px; border-radius: 8px; background: #2e2239; color: #f6efe2; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.12em">BURN TICK · ×0.7</span>
</div>
</div>

<div style="height: 360px; background: #d9d4a4; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center">
<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<span style="font-family: 'Passion One', sans-serif; font-size: 34px; line-height: 1; color: #ffed59; text-shadow: -2px 0 #1a1917, 2px 0 #1a1917, 0 -2px #1a1917, 0 3px #1a1917">34</span>
<span style="padding: 3px 10px; border-radius: 8px; background: #2e2239; color: #f6efe2; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.12em">SIZE · SMALL</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<span style="font-family: 'Passion One', sans-serif; font-size: 50px; line-height: 1; color: #ffed59; text-shadow: -3px 0 #1a1917, 3px 0 #1a1917, 0 -3px #1a1917, 0 4px #1a1917">34</span>
<span style="padding: 3px 10px; border-radius: 8px; background: #2e2239; color: #f6efe2; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.12em">SIZE · MEDIUM (DEFAULT)</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 22px">
<span style="font-family: 'Passion One', sans-serif; font-size: 70px; line-height: 1; color: #ffed59; text-shadow: -4px 0 #1a1917, 4px 0 #1a1917, 0 -4px #1a1917, 0 5px #1a1917">34</span>
<span style="padding: 3px 10px; border-radius: 8px; background: #2e2239; color: #f6efe2; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.12em">SIZE · LARGE</span>
</div>
</div>

</div>
</body>
</html>
