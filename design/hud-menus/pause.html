<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pause</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&amp;family=Passion+One:wght@400;700;900&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#1c1424;font-family:Archivo,sans-serif;color:#f6efe2}
</style>
</head>
<body>
<div style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #bcd6ea; font-family: Archivo, sans-serif; color: #f6efe2">
<div style="position: absolute; left: -200px; top: 300px; width: 1200px; height: 520px; border-radius: 50%; background: #a5c0cf"></div>
<div style="position: absolute; left: 700px; top: 330px; width: 1500px; height: 520px; border-radius: 50%; background: #9db6c8"></div>
<div style="position: absolute; left: -100px; top: 470px; width: 900px; height: 300px; border-radius: 50%; background: #9fbf9a"></div>
<div style="position: absolute; left: 600px; top: 480px; width: 1000px; height: 300px; border-radius: 50%; background: #93b58f"></div>
<div style="position: absolute; left: -40px; top: 548px; width: 2000px; height: 70px; border-radius: 35px; background: #86ab80"></div>
<div style="position: absolute; left: 0px; top: 590px; width: 1920px; height: 490px; background: #d9d4a4"></div>
<div style="position: absolute; left: 0px; top: 0px; width: 1920px; height: 1080px; background: rgba(28,20,36,0.74)"></div>

<div style="position: absolute; left: 700px; top: 250px; width: 520px; box-sizing: border-box; padding: 34px 40px 36px 40px; background: #2e2239; border: 2px solid #c9ab6a; border-radius: 22px; box-shadow: 0 6px 0 #120d18; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
<span style="font-family: 'Passion One', sans-serif; font-size: 64px; line-height: 1; color: #edc65a">PAUSED</span>
<span style="padding: 2px 10px; border-radius: 8px; background: #c9ab6a; color: #231a2b; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px">P1</span>
</div>
<button type="button" style="height: 68px; border-radius: 16px; border: 3px solid #edc65a; background: #c9ab6a; color: #231a2b; font-family: 'Passion One', sans-serif; font-size: 34px; box-shadow: 0 5px 0 #7d6636; cursor: pointer">Resume</button>
<button type="button" style="height: 68px; border-radius: 16px; border: 2px solid #7d6636; background: #1e1628; color: #f6efe2; font-family: 'Passion One', sans-serif; font-size: 34px; box-shadow: 0 5px 0 #120d18; cursor: pointer">Settings</button>
<button type="button" style="height: 68px; border-radius: 16px; border: 2px solid #7d6636; background: #1e1628; color: #f6efe2; font-family: 'Passion One', sans-serif; font-size: 34px; box-shadow: 0 5px 0 #120d18; cursor: pointer">Return to chapter select</button>
</div>

<div style="position: absolute; right: 56px; bottom: 44px; display: flex; align-items: center; gap: 28px; font-weight: 600; font-size: 18px">
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; width: 26px; height: 26px; border-radius: 13px; align-items: center; justify-content: center; background: #4f9a3a; color: #ffffff; font-weight: 700; font-size: 14px">A</span><span>Choose</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="display: inline-flex; width: 26px; height: 26px; border-radius: 13px; align-items: center; justify-content: center; background: #d0453c; color: #ffffff; font-weight: 700; font-size: 14px">B</span><span>Resume</span></div>
</div>
</div>
</body>
</html>
