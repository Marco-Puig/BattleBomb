</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 0 18px 0; background: #2e2239; border-radius: 16px">
<div style="width: 150px; height: 150px; display: flex; align-items: center; justify-content: center">
<svg width="150" height="150" viewBox="0 0 150 150" aria-hidden="true"><g stroke="#fff1b0" stroke-width="5" stroke-linecap="round"><path d="M75 4 L75 14"/><path d="M75 136 L75 146"/><path d="M4 75 L14 75"/><path d="M136 75 L146 75"/><path d="M25 25 L32 32"/><path d="M125 25 L118 32"/><path d="M25 125 L32 118"/><path d="M125 125 L118 118"/></g><circle cx="75" cy="75" r="54" fill="rgba(18,13,24,0.55)" stroke="#120d18" stroke-width="8"/><circle cx="75" cy="75" r="54" fill="none" stroke="#edc65a" stroke-width="8" stroke-dasharray="339" stroke-dashoffset="102" stroke-linecap="round" transform="rotate(-90 75 75)"/><path d="M75 107 C 45 87, 41 67, 53 57 C 63 49, 73 55, 75 63 C 77 55, 87 49, 97 57 C 109 67, 105 87, 75 107 Z" fill="#ff6b61" stroke="#1a1917" stroke-width="5" stroke-linejoin="round"/><path d="M59 65 C 61 61, 65 60, 68 61" stroke="#f6efe2" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
</div>
<span style="font-family: 'Passion One', sans-serif; font-size: 24px; line-height: 1; color: #edc65a">Big progress</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; color: rgba(246,239,226,0.62)">PRESS ON THE BEAT</span>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 0 18px 0; background: #2e2239; border-radius: 16px">

<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" fill="rgba(18,13,24,0.55)" stroke="#120d18" stroke-width="8"/><circle cx="60" cy="60" r="54" fill="none" stroke="#edc65a" stroke-width="8" stroke-dasharray="339" stroke-dashoffset="186" stroke-linecap="round" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(246,239,226,0.4)" stroke-width="8" stroke-dasharray="17 322" stroke-dashoffset="-153" transform="rotate(-90 60 60)"/><path d="M60 92 C 30 72, 26 52, 38 42 C 48 34, 58 40, 60 48 C 62 40, 72 34, 82 42 C 94 52, 90 72, 60 92 Z" fill="#c84a42" stroke="#1a1917" stroke-width="5" stroke-linejoin="round"/></svg>
</div>
<span style="font-family: 'Passion One', sans-serif; font-size: 24px; line-height: 1; color: rgba(246,239,226,0.62)">Small progress</span>
<span style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; color: rgba(246,239,226,0.62)">RUSHED PRESS</span>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 34px 0 30px 0; background: #1e1628; border: 2px solid #e0574f; border-radius: 18px">
<span style="font-family: 'Passion One', sans-serif; font-size: 104px; line-height: 0.95; color: #e0574f; text-shadow: -4px 0 #1a1917, 4px 0 #1a1917, 0 -4px #1a1917, 0 6px #1a1917">WIPED OUT</span>
<span style="font-size: 22px; color: #f6efe2">Back to the chest. Everything you grabbed is kept.</span>
</div>
</div>
